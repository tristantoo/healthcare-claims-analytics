[project]
name = "claims"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "pyodbc>=5.3.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claims"]

[tool.pytest.ini_options]
testpaths = ["tests"]
